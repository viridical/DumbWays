<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="day3.css" />
</head>
<body>

    <div class="container">
        <header>
            <h1>S1D3 - JavaScript Intermediate</h1>
            <h2>Expense Tracker</h2>
        </header>

        <section class="form-section">
            <h3>Tambah Pengeluaran</h3>
            <div id="errorMsg" class="error-msg hidden">Harap isi nama dan nominal pengeluaran!</div>

            <form id="expenseForm">
                <div class="form-group">
                    <label for="nameInput">Nama Pengeluaran</label>
                    <input type="text" id="nameInput" placeholder="Contoh: Makan Siang" />
                </div>
                <div class="form-group">
                    <label for="amountInput">Nominal / Harga (Rp)</label>
                    <input type="number" id="amountInput" placeholder="Contoh: 25000" />
                </div>
                <button type="submit" id="addBtn">Tambah</button>
            </form>
        </section>

        <section class="list-section">
            <h3>Daftar Pengeluaran</h3>
            <div id="expenseList"></div>
            <div class="total-container">
                <span>Total</span>
                <span id="totalAmount">Rp 0</span>
            </div>
        </section>
    </div>

    <script src="day3.js"></script>
</body>
</html>
